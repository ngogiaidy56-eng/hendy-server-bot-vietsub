name: CI Health Check — API Keys & Edge Gateway Status

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify External Tier 7 API Keys & Edge Dispatcher Heartbeat
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDGE_DISPATCHER_URL: ${{ secrets.EDGE_DISPATCHER_URL }}
        run: |
          node scripts/validate-and-save-keys.js --check-only
          curl -fsSL "${EDGE_DISPATCHER_URL}/api/health" || exit 1
